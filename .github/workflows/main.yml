name: update-spx
on:
  schedule: [{ cron: "*/10 13-21 * * 1-5" }]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p data && python scraper.py
      - run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add data/ && git commit -m "update" || exit 0
          git push
